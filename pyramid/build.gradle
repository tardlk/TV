plugins {
    id 'com.android.library'
    id 'com.chaquo.python'
}

android {
    namespace "com.undcover.freedom.pyramid"
    compileSdk 35

    defaultConfig {
        minSdkVersion 28
        targetSdkVersion 28

    }

    flavorDimensions "mode"
    productFlavors {
        python {
            dimension "mode"
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
        }
        python32 {
            dimension "mode"
            ndk {
                abiFilters "armeabi-v7a"
            }
        }
        python64 {
            dimension "mode"
            ndk {
                abiFilters "arm64-v8a"
            }
        }
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main{
            // Android代码模块
            setRoot "src/main"
            // Python代码模块，也就是你的Python源码所在项目中的文件夹
        }
    }
}

dependencies {

}

chaquopy {
    defaultConfig {
        version "3.8"
        buildPython(project.findProperty("buildPython") ?: System.getenv("TV_BUILD_PYTHON") ?: "python3")
        pip { install "-r", "requirements.txt" }
    }
    sourceSets { main { srcDir "src/python" } }
}
